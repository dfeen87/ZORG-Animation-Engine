name: ZORG Deep Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Mathematical verification (ubuntu-24.04, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: '--tb=short -o faulthandler_timeout=30'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      ZORG_CI_TAKE: outputs/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install locked environment
        id: install
        run: |
          python scripts/ci.py run locked-dependencies -- python -m pip install --disable-pip-version-check -r requirements.lock
          python scripts/ci.py run editable-install -- python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python scripts/ci.py run dependency-check -- python -m pip check
      - name: Provision and verify FFmpeg, ffprobe and libx264
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            python scripts/ci.py run media-install -- sudo apt-get install --no-install-recommends -y ffmpeg
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            python scripts/ci.py run media-install -- brew install ffmpeg
          else
            exit 1
          fi
          python scripts/ci.py run media-readiness -- python scripts/ci.py check-media
      - name: Record environment and versions
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python scripts/ci.py run diagnostics -- python scripts/ci.py diagnostics
      - name: Reproduce full Build 0 experiment and all tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run --pytest-report pytest-outcomes.json build0 -- python scripts/run_build0.py --out "$ZORG_CI_TAKE/build0"
      - name: Audit complete test inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run test-audit -- python scripts/ci.py audit-tests --junit "$ZORG_CI_TAKE/build0/tests/junit.xml"
      - name: Generate semantic morph demonstration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run morph-demo -- commander-zorg morph-demo --out "$ZORG_CI_TAKE/morph" --no-mp4
      - name: Verify semantic morph evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run morph-check -- python scripts/check_morph_demo.py "$ZORG_CI_TAKE/morph/video/manifest.json" --report "$ZORG_CI_TAKE/morph/check_report.json"
      - name: Generate original live demonstration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run live-demo -- commander-zorg live-demo --out "$ZORG_CI_TAKE/live" --no-mp4
      - name: Verify original live evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run live-check -- python scripts/check_live_demo.py "$ZORG_CI_TAKE/live/video/manifest.json" --report "$ZORG_CI_TAKE/live/check_report.json"
      - name: Reproduce and verify chromatic motion demonstration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/ci.py run chromatic-demo -- python scripts/demo_chromatic_cloud.py --out "$ZORG_CI_TAKE/chromatic" --no-mp4
      - name: Collect compact mathematical reports
        if: ${{ always() }}
        run: python scripts/ci.py run compact-reports -- python scripts/ci.py compact "$ZORG_CI_TAKE"
      - name: Summarize every required stage
        if: ${{ always() }}
        run: python scripts/ci.py summary deep
      - name: Upload private verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deep-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7
